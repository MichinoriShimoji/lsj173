<style>
/* ---------- viewer shell ---------- */
html, body { height: 100%; margin: 0; background: #1b1b1b; color: #e8e8e8; font-family: 'Noto Sans JP', Arial, sans-serif; overflow: hidden; }
#viewport { position: fixed; inset: 0 0 44px 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #fff; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; background: #111; font-size: 14px; user-select: none; }
#bar button { font: inherit; color: #e8e8e8; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
#bar button:hover { background: #3a3a3a; }
#bar button:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 1px; }
#count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
#title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #aaa; padding: 0 8px; }
#hint { color: #888; white-space: nowrap; }
#msg { position: fixed; inset: 0 0 44px 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 16px; line-height: 1.8; color: #ccc; }
@media (max-width: 720px) { #hint, #title { display: none; } }

/* Inside the presenter view: no bar; the preview of the next slide (solo) has no arrows either. */
.embed #bar, .solo #stage .nav { display: none; }
.embed #viewport, .embed #msg { inset: 0; }
.embed #stage { box-shadow: none; }
/* Slide navigation: an arrow appears when the pointer is over the left or right margin of the slide. */
#stage .nav { position: absolute; top: 72px; bottom: 0; width: 112px; z-index: 50; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s ease; -webkit-tap-highlight-color: transparent; }
#stage #prev { left: 0; }
#stage #next { right: 0; }
#stage .nav:hover, #stage .nav:focus-visible { opacity: 1; outline: none; }
#stage .nav[disabled] { display: none; }
#stage.zooming .nav { pointer-events: none; opacity: 0; }
#stage .nav span { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.94); border: 1px solid #d4d4d4; box-shadow: 0 2px 12px rgba(0,0,0,.14); display: flex; align-items: center; justify-content: center; }
#stage .nav:focus-visible span { border-color: #111; }
#stage .nav svg { width: 38px; height: 38px; fill: none; stroke: #111; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: none) { #stage .nav { opacity: .45; } }

 Sans JP', Arial, sans-serif; font-size:23px; font-weight:700; line-height:1.5; color:#111111\">問い2<\/p><\/div>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:40px\">\n    <div style=\"display:flex; flex-direction:column; gap:20px; padding:36px 44px 38px; border:2px solid #111111; border-radius:12px; background:#ffffff\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"padding:4px 20px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; font-weight:700; line-height:1.3; white-space:nowrap; color:#ffffff; background:#111111; border:2px solid #111111; border-radius:40px\">問い1<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:38px; font-weight:700; line-height:1.3; color:#1d4ed8\">APL と PPL<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:50px; font-weight:700; line-height:1.4; color:#111111\">集団を同定する仕組みを<br>共有するか<\/p><div style=\"display:flex; flex-direction:column; gap:10px; margin-top:6px; padding-top:20px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:0; align-items:flex-start\"><p style=\"flex:0 0 auto; width:80px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#6b6b6b\">背景<\/p><div style=\"flex:1; display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><span style=\"color:#6b6b6b\">共通　<\/span>共通の構造を認める分析（Vassilieva 2005）<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><span style=\"color:#6b6b6b\">区別　<\/span>デフォルト解釈による区別（Daniel 2020）<\/p><\/div><\/div><div style=\"display:flex; flex-direction:row; gap:0; align-items:flex-start\"><p style=\"flex:0 0 auto; width:80px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#6b6b6b\">発表<\/p><div style=\"flex:1; display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><b>佐々木・下地・上林<\/b><\/p><\/div><\/div><\/div><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:20px; padding:36px 44px 38px; border:2px solid #111111; border-radius:12px; background:#ffffff\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"padding:4px 20px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; font-weight:700; line-height:1.3; white-space:nowrap; color:#ffffff; background:#111111; border:2px solid #111111; border-radius:40px\">問い2<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:38px; font-weight:700; line-height:1.3; color:#1d4ed8\">APL と SML<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:50px; font-weight:700; line-height:1.4; color:#111111\">集団の指示と例示は<br>どうつながるか<\/p><div style=\"display:flex; flex-direction:column; gap:10px; margin-top:6px; padding-top:20px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:0; align-items:flex-start\"><p style=\"flex:0 0 auto; width:80px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#6b6b6b\">背景<\/p><div style=\"flex:1; display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><span style=\"color:#6b6b6b\">直接つながる　<\/span>上の配置図、Lewis 2024<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><span style=\"color:#6b6b6b\">そうではない　<\/span>新永 2020（AdPL と SML が近接）<\/p><\/div><\/div><div style=\"display:flex; flex-direction:row; gap:0; align-items:flex-start\"><p style=\"flex:0 0 auto; width:80px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#6b6b6b\">発表<\/p><div style=\"flex:1; display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.5; color:#111111\"><b>新永<\/b>（「たち」と「とか」の評定実験で、聞き手による関連者の同定可能性を操作）<\/p><\/div><\/div><\/div><\/div>\n  <\/div>\n  <p style=\"position:absolute; right:128px; bottom:64px; width:120px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; text-align:right; color:#6b6b6b\">5<\/p>\n<\/section>\n", "intro-q1": "<section id=\"intro-q1\" data-transition=\"fade\" style=\"display:flex; flex-direction:column; gap:32px; padding:128px 128px 160px; font-family:'Noto Sans JP', Arial, sans-serif; background:#ffffff; color:#111111\">\n  <div style=\"position:absolute; top:0; left:0; width:1920px; height:72px; display:flex; flex-direction:row; gap:64px; align-items:center; padding:0 128px; background:#f3f3f3\">\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.4; color:#6b6b6b; border-bottom:4px solid #f3f3f3\">1　要としての APL<\/p>\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.4; color:#6b6b6b; border-bottom:4px solid #f3f3f3\">2　二つの問い<\/p>\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; color:#111111; border-bottom:4px solid #1d4ed8\">3　各発表<\/p>\n  <\/div>\n  <h2 style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:56px; font-weight:700; line-height:1.2; color:#111111\">問い1　APL と PPL：集団を同定する仕組みを共有するか<\/h2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:28px; align-items:stretch\">\n    <div style=\"display:flex; flex-direction:column; gap:16px; padding:28px 30px 32px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:42px; font-weight:700; line-height:1.3; color:#111111\">佐々木冠<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">三芳方言<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:2px; padding:14px 18px; background:#ffffff; border:1px solid #d4d4d4; border-radius:8px\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:23px; line-height:1.55; white-space:nowrap; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:28px\">war-ra-ga<\/span><span style=\"color:#6b6b6b\">（2-PL-家）<\/span>「お前の家」<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:23px; line-height:1.55; white-space:nowrap; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:28px\">taroo-ra-ga<\/span><span style=\"color:#6b6b6b\">（太郎-PL-家）<\/span>「太郎の家」<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">形態上は複数の名詞が単数解釈になる、特別な「〜の家」構文を分析<\/p><p style=\"padding-top:16px; border-top:1px solid #bdbdbd; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><b>家族を最も基本的な指示解釈とする<\/b> APL の指示構造が、PPL にも並行的に生じる<\/p><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:16px; padding:28px 30px 32px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:42px; font-weight:700; line-height:1.3; color:#111111\">下地理則<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">今帰仁謝名方言<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:2px; padding:14px 18px; background:#ffffff; border:1px solid #d4d4d4; border-radius:8px\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:23px; line-height:1.55; white-space:nowrap; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:28px\">agamii<\/span><span style=\"color:#6b6b6b\"><\/span>「私たち」（包括代名詞）<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">慣習的な仲間関係を要求し、敵対場面では使いにくい<\/p><p style=\"padding-top:16px; border-top:1px solid #bdbdbd; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">「PPL にはデフォルトの指示解釈の制約はない」という仮説（Daniel 2020）への<b>反例<\/b><\/p><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:16px; padding:28px 30px 32px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:column; gap:0\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:42px; font-weight:700; line-height:1.3; color:#111111\">上林葵<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">神戸市方言<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:2px; padding:14px 18px; background:#ffffff; border:1px solid #d4d4d4; border-radius:8px\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:23px; line-height:1.55; white-space:nowrap; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:28px\">-ra<\/span><span style=\"color:#6b6b6b\"><\/span> の APL／PPL 用法を比較<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><b>話し手が集合を「共同体」として捉えること<\/b>が、指示範囲の同定に重要<\/p><p style=\"padding-top:16px; border-top:1px solid #bdbdbd; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">語幹（代名詞 vs. 名詞）ではなく、共通の接尾辞 <span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:30px\">-ra<\/span> の特性。日琉諸語では PPL も APL も Stem-PL 構造が一般的<\/p><\/div>\n  <\/div>\n  <p style=\"position:absolute; right:128px; bottom:64px; width:120px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; text-align:right; color:#6b6b6b\">6<\/p>\n<\/section>\n", "intro-q2": "<section id=\"intro-q2\" data-transition=\"fade\" style=\"display:flex; flex-direction:column; gap:36px; padding:128px 128px 160px; font-family:'Noto Sans JP', Arial, sans-serif; background:#ffffff; color:#111111\">\n  <div style=\"position:absolute; top:0; left:0; width:1920px; height:72px; display:flex; flex-direction:row; gap:64px; align-items:center; padding:0 128px; background:#f3f3f3\">\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.4; color:#6b6b6b; border-bottom:4px solid #f3f3f3\">1　要としての APL<\/p>\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.4; color:#6b6b6b; border-bottom:4px solid #f3f3f3\">2　二つの問い<\/p>\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; color:#111111; border-bottom:4px solid #1d4ed8\">3　各発表<\/p>\n  <\/div>\n  <h2 style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:56px; font-weight:700; line-height:1.2; color:#111111\">問い2　APL と SML：集団の指示と例示はどうつながるか<\/h2>\n  <div style=\"display:flex; flex-direction:row; gap:48px; align-items:flex-start; padding:34px 48px 28px; background:rgb(243,243,243); border:1px solid #d4d4d4; border-radius:12px\">\n      <div style=\"width:730px; flex:0 0 auto; display:flex; flex-direction:column; gap:0\">\n        <div style=\"display:flex; flex-direction:row; gap:20px; align-items:baseline; padding-bottom:18px\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:48px; font-weight:700; line-height:1.3; color:#111111\">新永悠人<\/p><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">各地の全国共通語<\/p><\/div>\n        <div style=\"display:flex; flex-direction:row; gap:20px; align-items:baseline; padding:16px 0; border-top:2px solid #111 b6b6b; border-bottom:4px solid #f3f3f3\">2　二つの問い<\/p>\n    <p style=\"padding:19px 0 15px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; color:#111111; border-bottom:4px solid #1d4ed8\">3　各発表<\/p>\n  <\/div>\n  <div style=\"display:flex; flex-direction:row; gap:40px; align-items:flex-end; justify-content:space-between\">\n    <h2 style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:56px; font-weight:700; line-height:1.2; color:#111111\">各発表の振り返り<\/h2>\n    <div style=\"flex:0 0 auto; display:flex; flex-direction:column; gap:6px\"><div style=\"display:flex; flex-direction:row; gap:14px; align-items:center\"><p style=\"flex:0 0 auto; padding:2px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い1<\/p><p style=\"flex:0 0 auto; width:150px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と PPL<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; white-space:nowrap; color:#111111\">集団を同定する仕組みを共有するか<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:14px; align-items:center\"><p style=\"flex:0 0 auto; padding:2px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い2<\/p><p style=\"flex:0 0 auto; width:150px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と SML<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; white-space:nowrap; color:#111111\">集団の指示と例示はどうつながるか<\/p><\/div><\/div>\n  <\/div>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px 32px\">\n    <div style=\"display:flex; flex-direction:column; gap:12px; padding:26px 36px 28px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:40px; font-weight:700; line-height:1.3; color:#111111\">佐々木冠<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">三芳方言<\/p><p style=\"flex:0 0 auto; padding:3px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い1<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と PPL<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">現象<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:29px; white-space:nowrap\">war-ra-ga<\/span>「お前の家」、<span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:29px; white-space:nowrap\">taroo-ra-ga<\/span>「太郎の家」：複数形の名詞が単数解釈になる「〜の家」構文<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">要点<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><b>家族を最も基本的な指示解釈とする<\/b> APL の指示構造が、PPL にも並行的に生じる<\/p><\/div><\/div><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:12px; padding:26px 36px 28px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:40px; font-weight:700; line-height:1.3; color:#111111\">下地理則<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">今帰仁謝名方言<\/p><p style=\"flex:0 0 auto; padding:3px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い1<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と PPL<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">現象<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">包括代名詞 <span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:29px; white-space:nowrap\">agamii<\/span>「私たち」は<b>慣習的な仲間関係<\/b>を要求し、敵対場面では使いにくい<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">要点<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">「PPL にはデフォルトの指示解釈の制約はない」という仮説（Daniel 2020）への反例<\/p><\/div><\/div><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:12px; padding:26px 36px 28px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:40px; font-weight:700; line-height:1.3; color:#111111\">上林葵<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">神戸市方言<\/p><p style=\"flex:0 0 auto; padding:3px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い1<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と PPL<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">現象<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:29px; white-space:nowrap\">-ra<\/span> の APL／PPL 用法を比較<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">要点<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><b>話し手が集合を「共同体」として捉えること<\/b>が、指示範囲の同定に重要。語幹ではなく、共通の接尾辞 <span style=\"font-family:'Charis SIL', Georgia, serif; font-style:italic; font-size:29px; white-space:nowrap\">-ra<\/span> の特性<\/p><\/div><\/div><\/div>\n    <div style=\"display:flex; flex-direction:column; gap:12px; padding:26px 36px 28px; background:#f3f3f3; border:1px solid #d4d4d4; border-radius:12px\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:center\"><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:40px; font-weight:700; line-height:1.3; color:#111111\">新永悠人<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:26px; line-height:1.4; color:#6b6b6b\">各地の全国共通語<\/p><p style=\"flex:0 0 auto; padding:3px 16px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:22px; font-weight:700; line-height:1.4; white-space:nowrap; color:#ffffff; background:#111111; border-radius:40px\">問い2<\/p><p style=\"flex:0 0 auto; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; font-weight:700; line-height:1.4; white-space:nowrap; color:#111111\">APL と SML<\/p><\/div><div style=\"display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid #bdbdbd\"><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">現象<\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">「たち」（APL）と「とか」（SML）の評定実験<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:16px; align-items:baseline\"><p style=\"flex:0 0 auto; width:64px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; line-height:1.5; color:#6b6b6b\">要点<\/p><div style=\"flex:1; display:flex; flex-direction:column; gap:2px\"><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; font-weight:700; line-height:1.5; color:#111111\">意味地図で、APL と SML は隣接するか<\/p><div style=\"display:flex; flex-direction:row; gap:0; align-items:baseline\"><p style=\"flex:0 0 auto; width:196px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">新永（2020）<\/p><p style=\"flex:0 0 auto; width:300px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><b style=\"color:#1d4ed8\">APL<\/b><span style=\"color:#6b6b6b\"> — <\/span><span style=\"color:#6b6b6b\">AdPL<\/span><span style=\"color:#6b6b6b\"> — <\/span><b>SML<\/b><\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; font-weight:700; line-height:1.5; color:#111111\">隣接しない<\/p><\/div><div style=\"display:flex; flex-direction:row; gap:0; align-items:baseline\"><p style=\"flex:0 0 auto; width:196px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">Lewis（2024）<\/p><p style=\"flex:0 0 auto; width:300px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\"><span style=\"color:#6b6b6b\">AdPL<\/span><span style=\"color:#6b6b6b\"> — <\/span><b style=\"color:#1d4ed8\">APL<\/b><span style=\"color:#6b6b6b\"> — <\/span><b>SML<\/b><\/p><p style=\"flex:1; font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; font-weight:700; line-height:1.5; color:#111111\">隣接する<\/p><\/div><p style=\"font-family:'Noto Sans JP', Arial, sans-serif; font-size:28px; line-height:1.5; color:#111111\">「とか」の結果は、新永（2020）の予想に抵触し、Lewis（2024）の予想とは抵触しない<\/p><\/div><\/div><\/div><\/div>\n  <\/div>\n  <p style=\"position:absolute; right:128px; bottom:64px; width:120px; font-family:'Noto Sans JP', Arial, sans-serif; font-size:24px; text-align:right; color:#6b6b6b\">9<\/p>\n<\/section>\n", "intro-refs": "<section id=\"intro-refs\" data-transition=\"fade\" style=\"display:flex; flex-direction:column; gap:36px; padding:128px 128px 160px; font-family:'Noto Sans JP', Arial, sans-serif; background:#ffffff; color:#111111\">\n  <div style=\"position:absolute; top:0; left:0; width:1920px; height:72px; displa (function () {

  var SCOPE = document.documentElement.getAttribute('data-deck') ? ':' + document.documentElement.getAttribute('data-deck') : '';

      // so two windows opening at the same moment cannot pull each other to the wrong slide.
      else if (m.t === 'ask') { if (readyAt < (m.ts || 0)) post({ t: 'slide', i: cur }); }

        var sec = slides[m.i];

  // Slides whose pictures are maps, not scenes: no hover zoom there.
  var NO_ZOOM = { cover: 1, sursurunga: 1, abruzzese: 1, operational: 1 };
  // Slides whose gray boxes are statements or figures, not example cards.
  var NO_CARD = { claim: 1, cross: 1, questions: 1, operational: 1 };
  // Slides where only the last gray card enlarges.
  var LAST_CARD = { typology: 1 };
  var GRAY = /background(-color)?\s*:\s*#f3f3f3/i;
  // Slides whose wide card is re-stacked while enlarged (see .stack).
  var STACK = { selection: 1 };
  // Other blocks that enlarge on hover: the block that holds the paragraph containing this text.
  //   up: how many levels above that paragraph the block is; rows: re-stack its rows while enlarged.
  var EXTRA = {
    hierarchy: [{ key: 'Bagvalal', up: 2, rows: true, lead: true }]
  };

  function fit() {
    var w = viewport.clientWidth, h = viewport.clientHeight;
    var s = Math.min(w / 1920, h / 1080);
    stage.style.transform = 'translate(' + Math.round((w - 1920 * s) / 2) + 'px,' + Math.round((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }

  function prepare(sec) {
    // Pictures are files of this page.
    sec.querySelectorAll('img').forEach(function (img) {
      var m = /\/_blob\/([0-9a-f]+)/.exec(img.getAttribute('src') || '');
      if (m) img.setAttribute('src', 'img/' + m[1] + '.png');
      var src = img.getAttribute('src');
      if (DATA && DATA.images && DATA.images[src]) img.setAttribute('src', DATA.images[src]);
      img.setAttribute('draggable', 'false');
    });
    // Arrow connectors: a line with a head, as thick as its border-width.
    sec.querySelectorAll('x-connector').forEach(function (c) {
      var st = c.getAttribute('style') || '';
      var m = /border-width\s*:\s*([\d.]+)px/.exec(st);
      var t = m ? parseFloat(m[1]) : 2;
      c.style.borderWidth = '0';
      c.style.height = t + 'px';
      c.style.setProperty('--hh', (t * 2.2 + 3) + 'px');
      c.style.setProperty('--hl', (t * 3 + 6) + 'px');
    });
    sec.removeAttribute('hidden');
    // Scenes: the box that holds a picture together with its caption and line.
    if (!NO_ZOOM[sec.id]) {
      sec.querySelectorAll('img').forEach(function (img) {
        var box = img.parentElement;
        if (!box || box === sec || box.classList.contains('scene')) return;
        if (box.querySelectorAll('p').length === 0) return;
        box.classList.add('scene');
      });
    }
    // Example cards: every gray box that holds an example (stimulus, gloss, form).
    if (!NO_CARD[sec.id]) {
      sec.querySelectorAll('div, p').forEach(function (el) {
        var st = el.getAttribute('style') || '';
        if (!GRAY.test(st)) return;
        if (/position\s*:\s*absolute/.test(st) && /height\s*:\s*72px/.test(st)) return; // header band
        if (el.closest('.scene') || el.closest('aside')) return;
        if (!(el.textContent || '').trim()) return;
        el.classList.add('scene', 'card');
        if (STACK[sec.id]) el.classList.add('stackable');
      });
      if (LAST_CARD[sec.id]) {
        var cards = sec.querySelectorAll('.scene.card');
        for (var c = 0; c < cards.length - 1; c++) cards[c].classList.remove('scene', 'card');
      }
    }
    (EXTRA[sec.id] || []).forEach(function (spec) {
      var ps = sec.querySelectorAll('p');
      for (var i = 0; i < ps.length; i++) {
        if (ps[i].textContent.indexOf(spec.key) < 0 || ps[i].closest('aside')) continue;
        var box = ps[i];
        for (var k = 0; k < spec.up && box; k++) box = box.parentElement;
        if (!box || box === sec || !sec.contains(box)) continue;
        box.classList.add('scene');
        if (spec.rows) box.classList.add('rows', 'stackable');
        if (spec.lead) box._lead = box.previousElementSibling;
        break;
      }
    });
    // A slide can also mark its own blocks: any element with the attribute data-zoom enlarges on hover.
    sec.querySelectorAll('[data-zoom]').forEach(function (el) { if (!el.closest('.scene') && !el.closest('aside')) el.classList.add('scene'); });
    if (sec.querySelector('.scene')) {
      // The pointer is tested against each scene's place in the layout (not its
      // enlarged picture), so moving to the neighbouring scene switches at once.
      sec.addEventListener('mousemove', function (e) { hit(sec, e, false); });
      sec.addEventListener('mouseleave', function () { sec.querySelectorAll('.scene.zoom').forEach(function (b) { zoomOut(b); }); });
      sec.addEventListener('click', function (e) { hit(sec, e, true); });
    }
  }

  function place(box, sec) {
    var x = 0, y = 0, el = box;
    while (el && el !== sec) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
    return { x: x, y: y, w: box.offsetWidth, h: box.offsetHeight };
  }

  function hit(sec, e, toggle) {
    var sr = stage.getBoundingClientRect();
    var scale = sr.width / 1920 || 1;
    var px = (e.clientX - sr.left) / scale, py = (e.clientY - sr.top) / scale;
    var found = null;
    sec.querySelectorAll('.scene').forEach(function (box) {
      var r = place(box, sec);
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) found = box;
    });
    var open = sec.querySelector('.scene.zoom');
    if (!found && open) {
      var zr = open.getBoundingClientRect();
      if (e.clientX >= zr.left && e.clientX <= zr.right && e.clientY >= zr.top && e.clientY <= zr.bottom) found = open;
    }
    if (toggle && found && found === open) { zoomOut(found); sec._tapOff = found; return; }
    if (!toggle && sec._tapOff && sec._tapOff === found) return;
    if (!found || sec._tapOff !== found) sec._tapOff = null;
    if (found) { if (found !== open) zoomIn(found, sec); }
    else if (open) zoomOut(open);
  }

  function zoomIn(box, sec, remote) {
    sec.querySelectorAll('.scene.zoom').forEach(function (b) { if (b !== box) zoomOut(b, true); });
    if (box.classList.contains('stackable')) box.classList.add('stack');
    if (box._lead && !box.querySelector('.lead-clone')) box.insertBefore(leadClone(box._lead), box.firstChild);
    var r = place(box, sec);
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var z = Math.min(1.6, 960 / h);
    var cx = x + w / 2, cy = y + h / 2;
    var ox = cx < 1920 * 0.4 ? 'left' : (cx > 1920 * 0.6 ? 'right' : 'center');
    var oy = cy < 1080 * 0.42 ? 'top' : (cy > 1080 * 0.6 ? 'bottom' : 'center');
    // A slide can say which way a block grows: data-zoom-origin="center bottom" keeps the bottom edge in place, and so on.
    var want = (box.getAttribute('data-zoom-origin') || '').split(' ');
    if (want.length === 2) { ox = want[0]; oy = want[1]; }
    var dx = 0;
    if (w * z > 1840) {
      // Too wide to grow as a whole: grow from the left, limited by where its content ends,
      // and slide left into the margin when that buys more room.
      var cw = contentWidth(box) + 36;
      z = Math.min(z, 1880 / cw);
      if (z < 1.1) z = 1.1;
      ox = 'left';
      if (x + cw * z > 1900) dx = Math.max(20 - x, 1900 - (x + cw * z));
    }
    else {
      var left = ox === 'left' ? x : (ox === 'right' ? x + w - w * z : x + w / 2 - w * z / 2);
      if (left + w * z > 1900) dx = 1900 - (left + w * z);
      if (left + dx < 20) dx = 20 - left;
    }
    // Keep the enlarged box inside the slide vertically as well.
    var top = oy === 'top' ? y : (oy === 'bottom' ? y + h - h * z : y + h / 2 - h * z / 2);
    var dy = 0;
    if (top + h * z > 1060) dy = 1060 - (top + h * z);
    if (top + dy < 20) dy = 20 - top;
    box.style.setProperty('--dx', dx.toFixed(1) + 'px');
    box.style.setProperty('--dy', dy.toFixed(1) + 'px');
    box.style.transformOrigin = ox + ' ' + oy;
    box.style.setProperty('--zoom', z.toFixed(3));
    box.classList.add('zoom');
    stage.classList.add('zooming');
    if (!remote) post({ t: 'zoom', on: true, i: slides.indexOf(sec), k: sceneIndex(box, sec) });
  }
  function sceneIndex(box, sec) { return Array.prototype.indexOf.call(sec.querySelectorAll('.scene'), box); }
  function zoomOut(box, remote) {
    if (!remote && box.classList.contains('zoom')) { var sec = box.closest('section'); post({ t: 'zoom', on: false, i: slides.indexOf(sec), k: sceneIndex(box, sec) }); }
    box.classList.remove('zoom', 'stack');
    var c = box.querySelector('.lead-clone');
    if (c) c.remove();
    if (!stage.querySelector('.scene.zoom')) stage.classList.remove('zooming');
  }

  // A compact copy of the figure above a block: each row becomes "label, then its bar(s)".
  function leadClone(lead) {
    var wrap = document.createElement('div');
    wrap.className = 'lead-clone';
    Array.prototype.forEach.call(lead.children, function (row) {
      var kids = row.children;
      if (kids.length >= 2 && kids[0].tagName === 'DIV') {
        var r = document.createElement('div'); r.className = 'lead-row';
        var label = kids[0].cloneNode(true); label.classList.add('lead-label');
        var bars = document.createElement('div'); bars.className = 'lead-bars';
        for (var i = 1; i < kids.length; i++) {
          var k = kids[i].cloneNode(true);
          if (k.tagName === 'DIV') k.style.height = '56px';
          bars.appendChild(k);
        }
        r.appendChild(label); r.appendChild(bars); wrap.appendChild(r);
      } else {
        wrap.appendChild(row.cloneNode(true));
      }
    });
    return wrap;
  }

  // How far right the text, pictures and painted shapes of a box reach, in slide pixels from its left edge.
  function contentWidth(box) {
    var scale = stage.getBoundingClientRect().width / 1920 || 1;
    var left = box.getBoundingClientRect().left, right = left;
    var walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
    var range = document.createRange(), node;
    while ((node = walker.nextNode())) {
      if (!node.nodeValue.trim()) continue;
      range.selectNodeContents(node);
      var rects = range.getClientRects();
      for (var i = 0; i < rects.length; i++) if (rects[i].right > right) right = rects[i].right;
    }
    box.querySelectorAll('img, svg').forEach(function (g) {
      var r = g.getBoundingClientRect(); if (r.right > right) right = r.right;
    });
    box.querySelectorAll('*').forEach(function (e) {
      if (e.firstElementChild) return;
      var cs = getComputedStyle(e);
      var painted = (cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent') || parseFloat(cs.borderTopWidth) > 0;
      if (!painted) return;
      var r = e.getBoundingClientRect(); if (r.width && r.right > right) right = r.right;
    });
    return (right - left) / scale;
  }

  // Header band: each section name jumps to the first slide of that section.
  function band(sec) {
    var kids = sec.children;
    for (var i = 0; i < kids.length; i++) {
      var st = kids[i].getAttribute('style') || '';
      if (/position\s*:\s*absolute/.test(st) && /height\s*:\s*72px/.test(st)) return kids[i];
    }
    return null;
  }
  function tabKey(p) { return p.textContent.replace(/\s+/g, ' ').trim(); }
  function linkTabs() {
    var first = {};
    slides.forEach(function (sec, i) {
      var b = band(sec); if (!b) return;
      b.querySelectorAll('p').forEach(function (p) {
        if (!/font-weight\s*:\s*700/.test(p.getAttribute('style') || '')) return;
        var key = tabKey(p);
        if (!(key in first)) first[key] = i;
      });
    });
    slides.forEach(function (sec) {
      var b = band(sec); if (!b) return;
      b.querySelectorAll('p').forEach(function (p) {
        var key = tabKey(p);
        if (!(key in first)) return;
        p.classList.add('tab');
        p.setAttribute('role', 'link');
        p.addEventListener('click', function (e) { e.stopPropagation(); show(first[key]); });
      });
    });
  }

  function show(i, replace, silent) {
    if (!slides.length) return;
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) {
      s.classList.toggle('current', k === cur);
      if (k !== cur) s.querySelectorAll('.scene.zoom').forEach(function (b) { zoomOut(b, true); });
    });
    document.getElementById('count').textContent = (cur + 1) + ' / ' + slides.length;
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === slides.length - 1;
    var h = slides[cur].querySelector('h1, h2');
    document.getElementById('title').textContent = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
    var hash = '#slide-' + (cur + 1);
    if (location.hash !== hash) {
      try { if (replace) history.replaceState(null, '', hash); else location.hash = hash; } catch (e) { /* ignore */ }
    }
    if (!silent) post({ t: 'slide', i: cur });
  }
  function fromHash() {
    var m = /^#slide-(\d+)$/.exec(location.hash || '');
    return m ? parseInt(m[1], 10) - 1 : 0;
  }

  function fetchParts() {
    return fetch('project/deck.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('deck.json ' + r.status);
      return r.json();
    }).then(function (deck) {
      var order = deck.order || [];
      return Promise.all(order.map(function (id) {
        return fetch('project/slides/' + id + '.html', { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error(id + ' ' + r.status);
          return r.text();
        });
      }));
    });
  }
  function load() {
    var parts = DATA ? Promise.resolve(DATA.order.map(function (id) { return DATA.slides[id] || ''; })) : fetchParts();
    parts.then(function (parts) {
      var tmp = document.createElement('div');
      parts.forEach(function (html) {
        tmp.innerHTML = html;
        var sec = tmp.querySelector('section');
        if (!sec) return;
        tmp.querySelectorAll('script').forEach(function (s) { s.remove(); });
        prepare(sec);
        stage.appendChild(sec);
        slides.push(sec);
      });
      if (!slides.length) throw new Error('no slides');
      linkTabs();
      msg.style.display = 'none';
      fit();
      show(fromHash(), true, true);
      readyAt = Date.now();
      post({ t: 'ask', ts: readyAt });
    }).catch(function (err) {
      msg.textContent = 'スライドを読み込めませんでした（' + err.message + '）。';
    });
  }

  document.getElementById('prev').addEventListener('click', function () { this.blur(); show(cur - 1); });
  document.getElementById('next').addEventListener('click', function () { this.blur(); show(cur + 1); });
  document.getElementById('btn-full').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    } catch (e) { /* not allowed here */ }
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { show(cur + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { show(cur - 1); e.preventDefault(); }
    else if (k === 'Home') { show(0); e.preventDefault(); }
    else if (k === 'End') { show(slides.length - 1); e.preventDefault(); }
    // P: open the presenter view (notes, next slide, timer) in another window.
    else if ((k === 'p' || k === 'P') && !query.has('embed') && location.protocol !== 'file:') { window.open('presenter.html?t=' + Date.now() + '#slide-' + (cur + 1), 'lsj173-presenter' + SCOPE); }
  });
  window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== cur) show(i, true); });
  window.addEventListener('resize', fit);
  fit();
  load();
})();
</script>
</body>
</html>
